services:
  # ── SafeGas AI FastAPI Backend Web Service ────────────────────────────────────
  - type: web
    name: safegas-backend
    env: python
    rootDir: Backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_NAME
        value: SafeGas AI API
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SAFEGAS_DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: safegas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false

  # ── SafeGas AI Frontend Static Site ──────────────────────────────────────────
  - type: web
    name: safegas-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: safegas-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HP_GAS_REFILL_NUMBER
        value: "+919493602222"

databases:
  - name: safegas-db
    plan: free
    databaseName: safegas_db
    user: safegas_user
